# -------------- Serce systemu ----------------------
  spottool.web:
    #container_name: SpotTool-Ui-${ASPNETCORE_ENVIRONMENT}
    image: spottool-web:${APP_VERSION:-0.1}
    # env_file:
    #   - .env
    build:
      context: .
      dockerfile: SpotTool.Web/Dockerfile
    restart: unless-stopped
    deploy:
      replicas: ${WEB_REPLICAS_NO:-1}  
    ports:
      - ${WEB_PORT:-7000}:${WEB_PORT:-7000}
    environment:
      - ASPNETCORE_HTTP_PORTS=${WEB_PORT:-7000}
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=false
      - ConnectionStrings__SpotToolMartenDB=${DB_CONNECTION_STRING:-Server=postgresServer;Database=SpotToolDB;User Id=postgres;Password=postgres;Port=5432;}
      # - ApiSettings__MainUrl=${HTTP_PROTOCOL}://${API_COMPOSE_SERVICE_NAME}:${API_PORT}/
      # - AppSettings__GoogleApiKey=${GOOGLE_API_KEY}
      # - AppSettings__AdminEmail=${ADMIN_EMAIL}
      # - UI_LP_URL=${UI_LP_URL}
      # - CLOUDFLARE_TS_KEY=${CLOUDFLARE_TS_KEY}
      # - TZ=Europe/Warsaw
      #- SeriLogSettings__LogPaths__All=${MAIN_OUTPUT_DIR}${UI}${LOGS}/SpotTool.log
    # volumes:
    #   - ${MAIN_OUTPUT_DIR}${UI}${UPLOAD}:/app/wwwroot/uploads
    #   - ${MAIN_OUTPUT_DIR}${UI}${LOGS}:/app/logs
